<!DOCTYPE html>
<html>

<head>
    <title>Modern Card Design</title>

    <style>
        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            width: 280px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background-color: white;
            text-align: center;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        h3 {
            margin: 10px 0;
            color: #1E3A8A;
        }

        p {
            font-size: 14px;
            color: #555;
        }

        button {
            background-color: #2563EB;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1D4ED8;
        }
    </style>

</head>

<body>

    <div class="card">

        <img src="https://friendlystock.com/wp-content/uploads/2020/03/7-happy-desktop-computer-waving-cartoon-clipart.jpg">

        <div class="card-content">
            <h3>Modern Card</h3>

            <p>This is an upgraded card design with hover effect and better UI.</p>

            <button>Read More</button>
        </div>

    </div>

</body>

</html>
