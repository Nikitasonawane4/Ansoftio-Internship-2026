<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>

<body>

<h2>Student Registration Form</h2>

<form>

   
    <h3>Basic Information:</h3>

    <label>Full Name:</label><br>
    <input type="text" name="fullname" placeholder="Enter your full name"><br><br>

    <label>Email Address:</label><br>
    <input type="email" name="email" placeholder="Enter your email"><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" placeholder="Enter password"><br><br>


  
    <h3>Gender:</h3>

    <input type="radio" name="gender" value="male"> Male<br>
    <input type="radio" name="gender" value="female"> Female<br><br>


  
    <h3>Skills:</h3>

    <input type="checkbox" name="skills" value="html"> HTML<br>
    <input type="checkbox" name="skills" value="css"> CSS<br>
    <input type="checkbox" name="skills" value="javascript"> JavaScript<br><br>


 
    <input type="submit" value="Register">

</form>

</body>
</html>
